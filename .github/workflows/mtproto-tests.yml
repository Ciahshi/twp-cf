name: MTProto relay tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test MTProto transport re-keying
        run: node --test
      - name: Check upstream entrypoint shell syntax
        run: sh -n upstream/entrypoint.sh
      - name: Validate upstream Docker Compose
        run: docker compose --env-file .env.upstream.example -f compose.upstream.yaml config --quiet
